name: Refresh public profile activity

on:
  push:
    branches: [main]
    paths: [scripts/update_activity.py, .github/workflows/profile-activity.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate public activity card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Save refreshed card
        run: |
          if ! git diff --quiet -- assets/activity.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/activity.svg
            git commit -m 'Refresh public GitHub activity'
            git push
          fi
